<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" id="mecha-robot-dial">
  <defs>
    <!-- Background & Shading Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <radialGradient id="ambientCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Finishes matching Reference Image -->
    <linearGradient id="metalBezelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="metalBezelLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <radialGradient id="facePlateGrad" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="65%" stop-color="#6b7280" />
      <stop offset="100%" stop-color="#374151" />
    </radialGradient>

    <!-- Neon Cyan HUD Glow Effects -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseEyeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="2.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Dark Canvas Backdrop -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="400" r="360" fill="url(#ambientCyanGlow)" />

  <!-- ==========================================
       ANIMATABLE GSAP SVG ROOT CONTAINER
       ========================================== -->
  <g id="robot-avatar" class="gsap-robot">

    <!-- 1. OUTER CHASSIS / NOTCH HOUSING & BRACKETS -->
    <g id="outer-housing" class="gsap-housing">
      <!-- Outer Track Dashed Ring -->
      <circle cx="400" cy="400" r="280" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8" opacity="0.6" />
      
      <!-- Top-Right Mechanical Bezel Segment -->
      <path d="M 400 112 A 288 288 0 0 1 688 400 L 664 400 A 264 264 0 0 0 400 136 Z" fill="url(#metalBezelLight)" />
      
      <!-- Mechanical Right Bracket / Latch -->
      <path d="M 675 352 L 706 366 L 706 434 L 675 448 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
      <rect x="682" y="380" width="10" height="40" rx="3" fill="#38bdf8" opacity="0.85" filter="url(#cyanGlow)" />

      <!-- Bottom-Left Mechanical Bezel Segment -->
      <path d="M 400 688 A 288 288 0 0 1 112 400 L 136 400 A 264 264 0 0 0 400 664 Z" fill="url(#metalBezelDark)" />

      <!-- Mechanical Left Bracket / Latch -->
      <path d="M 125 352 L 94 366 L 94 434 L 125 448 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
      <rect x="108" y="380" width="10" height="40" rx="3" fill="#38bdf8" opacity="0.85" filter="url(#cyanGlow)" />

      <!-- Radial Tachometer / Meter Gauge Ticks (Left Arc) -->
      <g id="tachometer-ticks" class="gsap-ticks" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanGlow)">
        <line x1="165" y1="400" x2="135" y2="400" />
        <line x1="166" y1="365" x2="138" y2="361" />
        <line x1="172" y1="331" x2="145" y2="323" />
        <line x1="181" y1="298" x2="156" y2="287" />
        <line x1="194" y1="266" x2="171" y2="252" />
        <line x1="210" y1="236" x2="190" y2="220" />
        <line x1="230" y1="209" x2="212" y2="191" />
        <line x1="254" y1="185" x2="238" y2="165" />
        <line x1="281" y1="165" x2="267" y2="144" />
        <line x1="310" y1="149" x2="300" y2="127" />
        <line x1="341" y1="138" x2="334" y2="115" />
        <line x1="373" y1="132" x2="370" y2="108" />
        <line x1="166" y1="435" x2="138" y2="439" />
        <line x1="172" y1="469" x2="145" y2="477" />
        <line x1="181" y1="502" x2="156" y2="513" />
        <line x1="194" y1="534" x2="171" y2="548" />
        <line x1="210" y1="564" x2="190" y2="580" />
        <line x1="230" y1="591" x2="212" y2="609" />
        <line x1="254" y1="615" x2="238" y2="635" />
        <line x1="281" y1="635" x2="267" y2="656" />
      </g>
    </g>

    <!-- 2. ROTATING HUD BEZEL RING -->
    <g id="bezel-ring" class="gsap-ring">
      <circle cx="400" cy="400" r="235" fill="none" stroke="#475569" stroke-width="16" />
      <circle cx="400" cy="400" r="243" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.4" />
      <circle cx="400" cy="400" r="227" fill="none" stroke="#0f172a" stroke-width="2" />
      
      <!-- Cyan Active HUD Arc -->
      <path id="hud-arc" d="M 400 165 A 235 235 0 0 1 566 233" fill="none" stroke="#00f0ff" stroke-width="14" stroke-linecap="round" filter="url(#cyanGlow)" />
      
      <!-- Opposite Accent Data Nodes -->
      <circle cx="234" cy="566" r="6" fill="#38bdf8" filter="url(#cyanGlow)" />
      <circle cx="218" cy="546" r="4.5" fill="#38bdf8" opacity="0.75" />
      <circle cx="205" cy="524" r="3.5" fill="#38bdf8" opacity="0.4" />
    </g>

    <!-- 3. INNER BEVEL GROOVE -->
    <g id="inner-bezel">
      <circle cx="400" cy="400" r="205" fill="#1e293b" stroke="#0f172a" stroke-width="4" />
      <circle cx="400" cy="400" r="195" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="160 30 40 30" opacity="0.75" />
    </g>

    <!-- 4. ROBOT FACEPLATE & VISOR EYES -->
    <g id="robot-core-face" class="gsap-face">
      <!-- Metallic Spherical Faceplate -->
      <circle cx="400" cy="400" r="185" fill="url(#facePlateGrad)" stroke="#94a3b8" stroke-width="3.5" />
      
      <!-- Forehead Seam -->
      <path d="M 270 330 C 340 310 460 310 530 330" fill="none" stroke="#cbd5e1" stroke-width="2.5" opacity="0.45" stroke-linecap="round" />
      
      <!-- Chin Mouth Vent Recess -->
      <path d="M 360 545 L 440 545 L 430 560 L 370 560 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <line x1="380" y1="552" x2="420" y2="552" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#cyanGlow)" />

      <!-- Cheek Seam Architecture -->
      <path d="M 245 385 L 285 410 L 285 460" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" />
      <path d="M 555 385 L 515 410 L 515 460" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" />

      <!-- Iconic Mecha Visor Slit Eyes -->
      <g id="robot-eyes" class="gsap-eyes" filter="url(#intenseEyeGlow)">
        <!-- Left Visor Eye -->
        <polygon points="295,396 360,394 372,408 340,412 290,404" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
        <!-- Right Visor Eye -->
        <polygon points="505,396 440,394 428,408 460,412 510,404" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
        <!-- Visor Energy Beams -->
        <line x1="310" y1="402" x2="355" y2="402" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
        <line x1="490" y1="402" x2="445" y2="402" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Forehead Hex Core Sensor -->
      <polygon points="400,345 408,350 408,360 400,365 392,360 392,350" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="400" cy="355" r="2.5" fill="#00f0ff" filter="url(#cyanGlow)" />
    </g>

    <!-- 5. TARGETING RETICLE OVERLAY -->
    <g id="targeting-overlay" class="gsap-scanner" pointer-events="none">
      <line x1="400" y1="100" x2="400" y2="122" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      <line x1="400" y1="678" x2="400" y2="700" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      <line x1="100" y1="400" x2="122" y2="400" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      <line x1="678" y1="400" x2="700" y2="400" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    </g>
  </g>
</svg>